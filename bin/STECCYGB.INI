# STECCYGB.INI - reglages de STECCY-GB pour STM32 : a copier a la racine de la carte SD sous ce nom exact
# (8 caracteres max avant le point : FatFs est compile sans noms longs)
#
# PATH : repertoire des ROMs (Linux seulement)
PATH=
# ROM : ROM chargee au demarrage. Vide => STM32 : menu de choix ; Linux : ROM a donner en argument
ROM=
# PALETTE : green (vert DMG), gray, pocket
PALETTE=green
# SCALE : zoom 1, 2 ou 3. 0 = auto (Linux : max de la fenetre ; SSD1963 : x3 ; ILI9341 : x1,5)
SCALE=0
# FRAMESKIP : nombre max d'images sautees si l'emulation prend du retard (0 = jamais)
FRAMESKIP=1
# TURBO : yes = pas de limitation de vitesse (bascule aussi avec F3)
TURBO=no
# STM32 seulement - clavier(s) : PS2 et/ou USB (une ligne par clavier)
KEYBOARD=PS2
# STM32 seulement - orientation 0..3 (F1) et ordre des couleurs 0=RGB 1=GRB (F2), comme STECCY
ORIENTATION=0
RGB=0
# INFO=yes : images/s en haut a droite. INFO=2 : repartition du temps CPU en % (emu, ecran, usb, libre). INFO=no : rien
INFO=yes
# SOUND=yes : son sur le DAC, broche PA4 (via condensateur 10 uF vers un ampli LM386), bip de test au demarrage.
# SOUND=no : son coupe et non calcule (emulation plus rapide)
SOUND=yes
# TFTFAST=yes : ecritures rapides vers l'ecran ILI9341 (77 ns au lieu de 175). TFTFAST=no si l'image se brouille
TFTFAST=yes
